# =====================================================================
#  MonVoyage → TestFlight (GitHub Actions)
#  Génère le projet (XcodeGen), lance les tests, signe, incrémente le
#  numéro de build et envoie sur TestFlight.
#
#  Machine : image « xcode-27 » (Xcode 27.2 = SDK iOS 27, nécessaire pour
#  l'iPhone Duo et exigé par Apple à partir d'avril 2027).
#
#  Secrets (Settings > Secrets and variables > Actions > Secrets) :
#    APP_STORE_CONNECT_ISSUER_ID       Issuer ID de la clé API App Store Connect
#    APP_STORE_CONNECT_KEY_IDENTIFIER  Key ID de la clé API
#    APP_STORE_CONNECT_PRIVATE_KEY     contenu complet du fichier AuthKey_XXXX.p8
#    CERTIFICATE_PRIVATE_KEY           clé privée RSA du certificat de distribution
#
#  Les identifiants ci-dessous doivent rester identiques à ceux de project.yml.
# =====================================================================

name: MonVoyage → TestFlight

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "design/**"
      - "scripts/fetch_affluence.py"
      - ".github/workflows/affluence.yml"
      - ".github/workflows/cloudkit-schema.yml"
  workflow_dispatch: {}

concurrency:
  group: testflight
  cancel-in-progress: true

env:
  APP_BUNDLE_ID: fr.tanguy.monvoyage
  WIDGET_BUNDLE_ID: fr.tanguy.monvoyage.widget
  APP_STORE_APPLE_ID: "6837239666"
  XCODE_VERSION: "27.2"
  XCODE_PROJECT: MonVoyage.xcodeproj
  XCODE_SCHEME: MonVoyage

jobs:
  testflight:
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        run: |
          missing=0
          for name in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name manquant"; missing=1; fi
          done
          exit $missing

      - name: Choisir Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Installer XcodeGen et les outils de signature
        run: |
          brew install xcodegen
          pipx install codemagic-cli-tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Tests unitaires (le build échoue si un test échoue)
        run: |
          mkdir -p build
          # Simulateurs iPhone candidats : uniquement les systèmes iOS ≥ 26 réellement installés,
          # du plus récent au plus ancien (l'image GitHub peut annoncer un runtime absent).
          xcrun simctl list runtimes -j > build/runtimes.json
          xcrun simctl list devices -j > build/devices.json
          CANDIDATES=$(python3 - <<'PY'
          import json
          runtimes = json.load(open("build/runtimes.json"))["runtimes"]
          devices = json.load(open("build/devices.json"))["devices"]
          ios = [r for r in runtimes if r.get("platform", "iOS") == "iOS" and r.get("isAvailable")
                 and int(r["version"].split(".")[0]) >= 26]
          ios.sort(key=lambda r: [int(x) for x in r["version"].split(".")], reverse=True)
          for r in ios:
              phones = [d for d in devices.get(r["identifier"], []) if d["name"].startswith("iPhone") and d.get("isAvailable", True)]
              if phones:
                  print(phones[0]["udid"], r["version"])
          PY
          )
          echo "Candidats :"; echo "$CANDIDATES"
          ok=0
          while read -r SIM_ID VERSION; do
            [ -z "$SIM_ID" ] && continue
            echo "== Tests sur le simulateur iOS $VERSION ($SIM_ID)"
            xcodebuild test \
              -project "$XCODE_PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -destination "id=$SIM_ID" \
              CODE_SIGNING_ALLOWED=NO \
              > build/xcodebuild-test.log 2>&1 || true
            if grep -q "\*\* TEST SUCCEEDED \*\*" build/xcodebuild-test.log; then ok=1; break; fi
            if grep -qE "runtime is not available|Unable to boot|Unable to find a destination|Failed to install" build/xcodebuild-test.log; then
              echo "Simulateur indisponible, essai du suivant…"; continue
            fi
            break   # vrai échec de compilation ou de test
          done <<< "$CANDIDATES"
          grep -E "error:|Test Case .* failed|\*\* TEST|not available" build/xcodebuild-test.log | tail -60 || true
          [ "$ok" = 1 ]

      - name: Signature (profils App Store pour l'appli et le widget)
        run: |
          # Dépôt public : le nom du titulaire du certificat et l'identifiant d'équipe
          # sont masqués (***) dans tous les journaux qui suivent.
          set -o pipefail
          app-store-connect fetch-signing-files "$APP_BUNDLE_ID" --type IOS_APP_STORE --create > "$RUNNER_TEMP/sign.log" 2>&1 || { sed -E 's/(Distribution|Developer): [^(]+/\1: ***/g' "$RUNNER_TEMP/sign.log"; exit 1; }
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" --type IOS_APP_STORE --create >> "$RUNNER_TEMP/sign.log" 2>&1 || { sed -E 's/(Distribution|Developer): [^(]+/\1: ***/g' "$RUNNER_TEMP/sign.log"; exit 1; }
          grep -oE "(Distribution|Developer): [^(]+\([A-Z0-9]{10}\)" "$RUNNER_TEMP/sign.log" | sort -u > "$RUNNER_TEMP/ids.txt" || true
          while IFS= read -r line; do
            name=$(echo "$line" | sed -E 's/^[A-Za-z]+: (.*) \(([A-Z0-9]{10})\)$/\1/')
            team=$(echo "$line" | sed -E 's/.*\(([A-Z0-9]{10})\)$/\1/')
            [ -n "$name" ] && echo "::add-mask::$name"
            [ -n "$team" ] && echo "::add-mask::$team"
            echo "$name" >> "$RUNNER_TEMP/private-words.txt"
            echo "$team" >> "$RUNNER_TEMP/private-words.txt"
          done < "$RUNNER_TEMP/ids.txt"
          cat "$RUNNER_TEMP/sign.log"
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Numéro de build = dernier build TestFlight + 1
        run: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          if ! [[ "$LATEST" =~ ^[0-9]+$ ]]; then LATEST=0; fi
          NEW=$((LATEST + 1))
          echo "Dernier build TestFlight : $LATEST → nouveau build : $NEW"
          agvtool new-version -all "$NEW"

      - name: Compiler l'IPA
        run: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"

      - name: Envoyer sur TestFlight
        run: |
          app-store-connect publish --path "build/ios/ipa/*.ipa"

      - name: Restaurer le trousseau
        if: always()
        run: keychain use-login || true

      - name: Retirer les données personnelles des journaux conservés
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/private-words.txt" ] || exit 0
          for log in build/xcodebuild-test.log /tmp/xcodebuild_logs/*.log; do
            [ -f "$log" ] || continue
            while IFS= read -r word; do
              [ -n "$word" ] && perl -pi -e "s/\Q$word\E/***/g" "$log"
            done < "$RUNNER_TEMP/private-words.txt"
          done

      - name: Conserver les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-build
          path: |
            build/xcodebuild-test.log
            /tmp/xcodebuild_logs/*.log
          if-no-files-found: ignore
